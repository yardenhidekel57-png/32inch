<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0f172a; --gold: #d4af37; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; background: var(--blue); 
            font-family: 'Assistant', sans-serif; 
            height: 100vh; width: 100vw; overflow: hidden; /* מניעת גלילה מוחלטת */
        }
        
        /* Header - 12% מהמסך */
        .header {
            height: 12vh; padding: 1vh 2vw;
            display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center;
            border-bottom: 2px solid var(--gold); background: rgba(255,255,255,0.03);
        }
        .h-item { color: white; font-weight: 800; font-size: 1.8vw; }

        /* Main - 82% מהמסך */
        .container { 
            height: 82vh; padding: 1.5vh 2vw; 
            display: flex; gap: 2vw;
        }

        /* עמודת הודעות - 68% רוחב */
        .col-main { 
            width: 68%; height: 100%; background: white; border-radius: 20px; 
            display: flex; flex-direction: column; overflow: hidden;
        }
        .title { background: var(--blue); color: var(--gold); padding: 1vh; text-align: center; font-size: 1.6vw; font-weight: 800; }
        #msgs { padding: 1.5vh; flex-grow: 1; overflow-y: auto; font-size: 2.2vw; font-weight: 700; color: #1e293b; }
        .m-item { border-right: 10px solid var(--gold); background: #f8fafc; padding: 1.5vh; margin-bottom: 1vh; border-radius: 8px; }

        /* עמודה צדדית - 30% רוחב */
        .col-side { width: 30%; height: 100%; display: flex; flex-direction: column; gap: 1.5vh; }
        .card { background: white; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; height: 48%; }
        
        /* אזור אירועים - ניקוי שעות */
        .e-item { padding: 0.8vh 1vw; border-bottom: 1px solid #eee; font-size: 1.4vw; font-weight: 800; color: var(--blue); }
        
        /* אזור פרסום - ללא גלילה */
        .promo-img { width: 100%; height: 16vh; object-fit: cover; }
        .p-text { text-align: center; font-size: 1.4vw; font-weight: 800; padding: 0.5vh; }

        /* QR מוגדלים */
        .qr-box { background: #f1f5f9; padding: 0.8vh; display: flex; align-items: center; justify-content: center; gap: 1vw; border-top: 1px solid #ddd; }
        .qr-code { height: 8vh; width: 8vh; border: 2px solid var(--blue); border-radius: 5px; }

        /* Ticker - 6% מהמסך */
        .footer { position: fixed; bottom: 0; width: 100%; height: 6vh; background: white; border-top: 4px solid #ef4444; overflow: hidden; }
        #ticker { white-space: nowrap; position: absolute; line-height: 6vh; font-size: 2.2vw; color: #ef4444; font-weight: 800; }
    </style>
</head>
<body>

<div class="header">
    <div class="h-item" style="color: var(--gold);">📍 דודו דותן 2, נתניה</div>
    <div class="h-item" style="text-align: center;">
        <span id="h-time">00:00</span> | <span id="h-date" style="font-size: 1.4vw; opacity: 0.7;"></span>
    </div>
    <div class="h-item" style="text-align: left; font-size: 1vw; opacity: 0.6;">Gal & Yarden Board ©</div>
</div>

<div class="container">
    <div class="col-main">
        <div class="title">📢 הודעות ועד הבית</div>
        <div id="msgs">טוען...</div>
        <div style="background:#ef4444; color:white; text-align:center; padding:0.5vh; font-weight:bold; font-size:1.6vw;">🚨 חירום: 053-2784358</div>
    </div>

    <div class="col-side">
        <div class="card">
            <div class="title">🗓️ אירועים</div>
            <div id="events" style="flex-grow: 1; overflow: hidden;">טוען...</div>
            <div class="qr-box">
                <div style="font-size: 1vw; font-weight: 800;">לשריון<br>ג'ימבורי:</div>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://forms.gle/FiVeEZ6pes8JKA7d6" class="qr-code">
            </div>
        </div>
        <div class="card">
            <div class="title">🍰 פרסום</div>
            <img src="https://i.postimg.cc/8PKxcRFT/PHOTO-2026-02-24-10-45-14.jpg" class="promo-img">
            <div class="p-text">עוגות שמרים מעולם אחר!<br><span style="background:var(--gold); padding:0 8px; border-radius:4px;">052-2221491</span></div>
            <div class="qr-box">
                <div style="font-size: 1vw; font-weight: 800;">מעוניינים<br>בפרסום?</div>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://wa.me/972502655525" class="qr-code">
            </div>
        </div>
    </div>
</div>

<div class="footer"><div id="ticker">טוען מבזקים...</div></div>

<script>
    const URL = 'https://script.google.com/macros/s/AKfycbyu3cJo5iSfnKWjEz-lQ8WFC-z7Y3GoLi17BKV0nIaLrF6EktyAAwV-HS2H_XoYWrmG/exec';

    function updateTime() {
        const n = new Date();
        document.getElementById('h-time').innerText = n.getHours().toString().padStart(2,'0')+":"+n.getMinutes().toString().padStart(2,'0');
        document.getElementById('h-date').innerText = n.toLocaleDateString('he-IL');
    }

    async function load() {
        try {
            const r = await fetch(URL + '?t=' + Date.now());
            const d = await r.json();
            if(d.messages) document.getElementById('msgs').innerHTML = d.messages.slice(1).reverse().map(m => `<div class="m-item">${m.replace(/#/g,'<br>')}</div>`).join('');
            if(d.events) {
                document.getElementById('events').innerHTML = d.events.map(e => {
                    const p = e.split('|');
                    // חיתוך אגרסיבי: לוקח רק את ה-5 תווים הראשונים (DD/MM) או עד הרווח הראשון
                    let dOnly = p[0].trim().split(' ')[0];
                    if(dOnly.includes(':')) dOnly = p[0].trim().split(' ')[1] || dOnly; // הגנה למקרה שהשעה מופיעה ראשונה
                    return `<div class="e-item"><b>${dOnly}</b> | ${p[1] || ''}</div>`;
                }).join('');
            }
        } catch(e) {}
    }

    async function news() {
        try {
            const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.ynet.co.il%2FIntegration%2FStoryRss2.xml');
            const d = await r.json();
            document.getElementById('ticker').innerHTML = " • " + d.items.map(i => i.title).join(" • ");
        } catch(e) {}
    }

    let x = -500;
    function anim() {
        x += 1.5;
        if(x > window.innerWidth) x = -1500;
        document.getElementById('ticker').style.right = x + "px";
        requestAnimationFrame(anim);
    }

    setInterval(updateTime, 1000); setInterval(load, 30000); setInterval(news, 60000);
    updateTime(); load(); news(); anim();
</script>
</body>
</html>
