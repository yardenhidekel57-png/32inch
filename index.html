<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0f172a; --gold: #d4af37; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 2vh 4vw; background: var(--blue); 
            font-family: 'Assistant', sans-serif; height: 100vh; width: 100vw; 
            overflow: hidden; display: flex; flex-direction: column;
        }
        
        .header {
            height: 10vh; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--gold); padding: 0 1vw; margin-bottom: 2vh;
        }
        .h-item { color: white; font-weight: 800; font-size: 1.8vw; }

        .main { display: flex; gap: 2vw; height: 74vh; width: 100%; }
        
        .col-right { width: 64%; background: white; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
        .col-left { width: 34%; display: flex; flex-direction: column; gap: 2vh; }

        .card { background: white; border-radius: 20px; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .title { background: var(--blue); color: var(--gold); padding: 1vh; text-align: center; font-size: 1.5vw; font-weight: 800; }
        
        #msgs, #events { padding: 1.5vh; overflow-y: auto; flex-grow: 1; }
        .m-item { border-right: 8px solid var(--gold); background: #f8fafc; padding: 1.2vh; margin-bottom: 1vh; border-radius: 8px; font-size: 2vw; font-weight: 700; color: #1e293b; }
        .e-item { border-bottom: 1px solid #eee; padding: 1vh; font-size: 1.4vw; font-weight: 800; color: var(--blue); line-height: 1.2; }

        .promo-img { width: 100%; height: 13vh; object-fit: cover; }
        .qr-area { background: #f1f5f9; padding: 0.8vh; display: flex; align-items: center; justify-content: center; gap: 1vw; border-top: 1px solid #ddd; }
        .qr-code { height: 7.5vh; width: 7.5vh; border: 1px solid var(--blue); background: white; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 6vh; background: white; border-top: 4px solid #ef4444; overflow: hidden; }
        #ticker { white-space: nowrap; position: absolute; line-height: 6vh; font-size: 2.2vw; color: #ef4444; font-weight: 800; }
    </style>
</head>
<body>

<div class="header">
    <div class="h-item" style="color: var(--gold);">📍 דודו דותן 2, נתניה</div>
    <div class="h-item"><span id="clock">00:00</span> | <span id="date" style="font-size: 1.3vw;"></span></div>
    <div class="h-item" style="font-size: 1vw; opacity: 0.6;">Gal & Yarden Board ©</div>
</div>

<div class="main">
    <div class="col-right">
        <div class="title">📢 הודעות ועד הבית</div>
        <div id="msgs">טוען...</div>
    </div>
    <div class="col-left">
        <div class="card">
            <div class="title">🗓️ אירועים</div>
            <div id="events">טוען...</div>
            <div class="qr-area">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://forms.gle/FiVeEZ6pes8JKA7d6" class="qr-code">
                <div style="font-size: 0.9vw; font-weight: 800;">לשריון ג'ימבורי</div>
            </div>
        </div>
        <div class="card">
            <div class="title">🍰 פרסום</div>
            <img src="https://i.postimg.cc/8PKxcRFT/PHOTO-2026-02-24-10-45-14.jpg" class="promo-img">
            <div style="text-align: center; font-size: 1.1vw; font-weight: 800; padding: 0.3vh;">עוגות רון: 052-2221491</div>
            <div class="qr-area">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://wa.me/972502655525" class="qr-code">
                <div style="font-size: 0.9vw; font-weight: 800;">לפרסום כאן</div>
            </div>
        </div>
    </div>
</div>

<div class="footer"><div id="ticker">טוען...</div></div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyu3cJo5iSfnKWjEz-lQ8WFC-z7Y3GoLi17BKV0nIaLrF6EktyAAwV-HS2H_XoYWrmG/exec';

    function updateClock() {
        const n = new Date();
        document.getElementById('clock').innerText = n.getHours().toString().padStart(2,'0')+":"+n.getMinutes().toString().padStart(2,'0');
        document.getElementById('date').innerText = n.toLocaleDateString('he-IL');
    }

    async function loadData() {
        try {
            const r = await fetch(SCRIPT_URL + '?t=' + Date.now());
            const d = await r.json();
            
            if(d.messages) {
                document.getElementById('msgs').innerHTML = d.messages.slice(1).reverse().map(m => 
                    `<div class="m-item">${m.replace(/#/g,'<br>')}</div>`
                ).join('');
            }
            
            if(d.events) {
                document.getElementById('events').innerHTML = d.events.map(e => {
                    let text = e.split('|')[0] || "";
                    let content = e.split('|')[1] || "";
                    
                    // מחיקת כל מה שכולל נקודתיים (שעה) מהחלק של התאריך
                    let dateOnly = text.replace(/\b\d{1,2}:\d{2}\b/g, "").trim();
                    // ניקוי תווים מיותרים שנשארו (כמו קווים מפרידים)
                    dateOnly = dateOnly.replace(/[|-]/g, "").trim();
                    
                    return `<div class="e-item"><b>${dateOnly}</b> | ${content}</div>`;
                }).join('');
            }
        } catch(e) {}
    }

    async function getNews() {
        try {
            const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.ynet.co.il%2FIntegration%2FStoryRss2.xml');
            const d = await r.json();
            document.getElementById('ticker').innerHTML = " • " + d.items.map(i => i.title).join(" • ");
        } catch(e) {}
    }

    let x = 0;
    function animate() {
        x += 1.5;
        if(x > window.innerWidth) x = -1500;
        document.getElementById('ticker').style.right = x + "px";
        requestAnimationFrame(animate);
    }

    setInterval(updateClock, 1000); setInterval(loadData, 30000); setInterval(getNews, 60000);
    updateClock(); loadData(); getNews(); animate();
</script>
</body>
</html>
