<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0f172a; --gold: #d4af37; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 1.5vh 3vw; background: var(--blue); 
            font-family: 'Assistant', sans-serif; height: 100vh; width: 100vw; 
            overflow: hidden; display: flex; flex-direction: column;
        }
        
        .header {
            height: 8vh; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--gold); padding: 0 1vw; margin-bottom: 1.5vh;
        }
        .h-item { color: white; font-weight: 800; font-size: 1.8vw; }

        .main { display: flex; gap: 2vw; height: 78vh; width: 100%; margin-bottom: 1vh; }
        
        .col-right { width: 64%; background: white; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
        .col-left { width: 34%; display: flex; gap: 1.5vh; flex-direction: column; }

        .card { background: white; border-radius: 20px; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .title { background: var(--blue); color: var(--gold); padding: 0.8vh; text-align: center; font-size: 1.5vw; font-weight: 800; }
        
        #msgs, #events { padding: 1.2vh; overflow-y: auto; flex-grow: 1; }
        .m-item { border-right: 8px solid var(--gold); background: #f8fafc; padding: 1vh; margin-bottom: 0.8vh; border-radius: 8px; font-size: 1.9vw; font-weight: 700; color: #1e293b; }
        .e-item { border-bottom: 1px solid #eee; padding: 0.8vh; font-size: 1.3vw; font-weight: 800; color: var(--blue); }

        /* תיקון אזור ה-QR - מלל מימין לברקוד */
        .qr-area { 
            background: #f1f5f9; padding: 0.8vh 1.5vw; 
            display: flex; flex-direction: row-reverse; 
            align-items: center; justify-content: flex-end; gap: 1.5vw; 
            border-top: 1px solid #ddd; 
        }
        .qr-code { height: 7.5vh; width: 7.5vh; border: 1px solid var(--blue); background: white; }
        .qr-text { font-size: 1.2vw; font-weight: 800; color: var(--blue); text-align: right; }

        /* תיקון אזור הפרסום - פריסת תמונה מלאה */
        .promo-img { width: 100%; height: 16vh; object-fit: cover; } /* cover לפריסה מלאה */
        .promo-desc { text-align: center; font-size: 1.3vw; font-weight: 800; padding: 0.5vh; color: var(--blue); line-height: 1.2; }

        .footer { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 5.5vh; 
            background: white; border-top: 4px solid #ef4444; 
            display: flex; align-items: center; z-index: 100;
        }
        .ynet-logo { height: 3.5vh; margin-right: 1vw; padding-left: 1vw; border-left: 2px solid #ddd; }
        #ticker-container { flex-grow: 1; position: relative; height: 100%; overflow: hidden; }
        #ticker { 
            white-space: nowrap; position: absolute; line-height: 5.5vh; 
            font-size: 2vw; color: #ef4444; font-weight: 800; 
            right: -100%; /* התחלה מימין */
        }
    </style>
</head>
<body>

<div class="header">
    <div class="h-item" style="color: var(--gold);">📍 דודו דותן 2, נתניה</div>
    <div class="h-item"><span id="clock">00:00</span> | <span id="date">00/00/0000</span></div>
    <div class="h-item" style="font-size: 1vw; opacity: 0.6;">© Gal & Yarden Board</div>
</div>

<div class="main">
    <div class="col-right">
        <div class="title">📢 הודעות ועד הבית</div>
        <div id="msgs">טוען הודעות...</div>
        <div style="background:#ef4444; color:white; text-align:center; padding:0.4vh; font-weight:bold; font-size:1.3vw;">🚨 חירום חב' ניהול: 053-2784358</div>
    </div>

    <div class="col-side col-left">
        <div class="card">
            <div class="title">🗓️ לוח אירועים</div>
            <div id="events">טוען...</div>
            <div class="qr-area">
                <div class="qr-text">לשריון<br>ג'ימבורי:</div>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://forms.gle/FiVeEZ6pes8JKA7d6" class="qr-code">
            </div>
        </div>
        <div class="card">
            <div class="title">פרסום עסקים</div>
            <img src="https://i.postimg.cc/8PKxcRFT/PHOTO-2026-02-24-10-45-14.jpg" class="promo-img">
            <div class="promo-desc">
                עוגות שמרים מעולם אחר!<br>
                <span style="background:var(--gold); padding: 0 5px; border-radius: 4px;">רון: 052-2221491</span>
            </div>
            <div class="qr-area">
                <div class="qr-text">מעוניינים<br>בפרסום?</div>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://wa.me/972502655525" class="qr-code">
            </div>
        </div>
    </div>
</div>

<div class="footer ticker-bar">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Ynet_logo.svg/2560px-Ynet_logo.svg.png" class="ynet-logo">
    <div id="ticker-container"><div id="ticker">טוען מבזקים עדכניים...</div></div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyu3cJo5iSfnKWjEz-lQ8WFC-z7Y3GoLi17BKV0nIaLrF6EktyAAwV-HS2H_XoYWrmG/exec';

    function updateClock() {
        const n = new Date();
        document.getElementById('clock').innerText = n.getHours().toString().padStart(2,'0')+":"+n.getMinutes().toString().padStart(2,'0');
        document.getElementById('date').innerText = n.toLocaleDateString('he-IL').replace(/\./g, '/');
    }

    async function loadData() {
        try {
            const r = await fetch(SCRIPT_URL + '?t=' + Date.now());
            const d = await r.json();
            if(d.messages) document.getElementById('msgs').innerHTML = d.messages.slice(1).reverse().map(m => `<div class="m-item">${m.replace(/#/g,'<br>')}</div>`).join('');
            if(d.events) {
                document.getElementById('events').innerHTML = d.events.map(e => {
                    let parts = e.split('|');
                    let rawDate = parts[0] || "";
                    // מחיקת השעה - לוקח רק תאריך
                    let cleanDate = rawDate.match(/\d{1,2}\/\d{1,2}/) ? rawDate.match(/\d{1,2}\/\d{1,2}/)[0] : rawDate.trim();
                    return `<div class="e-item"><b>${cleanDate}</b> | ${parts[1] || ''}</div>`;
                }).join('');
            }
        } catch(e) {}
    }

    async function getNews() {
        try {
            const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.ynet.co.il%2FIntegration%2FStoryRss2.xml&t=' + Date.now());
            const d = await r.json();
            document.getElementById('ticker').innerHTML = " • " + d.items.map(i => i.title).join(" • ");
        } catch(e) {}
    }

    let x = -1000;
    function animate() {
        x += 1.8;
        const ticker = document.getElementById('ticker');
        const container = document.getElementById('ticker-container');
        if (x > container.offsetWidth + ticker.offsetWidth) {
            x = -ticker.offsetWidth;
        }
        ticker.style.right = x + "px";
        requestAnimationFrame(animate);
    }

    setInterval(updateClock, 1000); setInterval(loadData, 30000); setInterval(getNews, 300000);
    updateClock(); loadData(); getNews(); animate();
</script>
</body>
</html>
