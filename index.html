<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0f172a;
            --accent: #fbbf24;
            --card-bg: #ffffff;
            --main-text: #1e3a8a;
            --header-bg: #1e3c72;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; 
            background: var(--primary-bg);
            font-family: 'Assistant', sans-serif; height: 100vh; width: 100vw; 
            display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* Header Fix */
        .header-wrapper { 
            height: 12vh; background: var(--header-bg); display: flex; 
            justify-content: space-between; align-items: center; padding: 0 2vw;
            color: white; border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .header-right { flex: 1; font-size: 2.8vw; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .header-center { flex: 1; text-align: center; }
        #live-clock { font-size: 4.5vw; font-weight: 800; line-height: 1; }
        #live-date { font-size: 1.2vw; opacity: 0.8; margin-top: 5px; }
        .header-left { flex: 1; text-align: left; opacity: 0.6; font-size: 1.1vw; }

        .stage { height: 83vh; display: flex; flex-direction: row; gap: 1.5vw; padding: 1.5vh; }

        /* Right Column: Messages (Wide) */
        .main-col { width: 70%; display: flex; flex-direction: column; gap: 1.5vh; }
        
        /* Left Column: Events & Ads (Narrow) */
        .side-col { width: 30%; display: flex; flex-direction: column; gap: 1.5vh; }

        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .card-header { background: #f8fafc; color: var(--main-text); height: 5.5vh; display: flex; align-items: center; padding: 0 15px; font-weight: 800; font-size: 1.5vw; border-bottom: 3px solid #cbd5e1; gap: 10px; }

        /* Messages */
        #message-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg-bubble { 
            background: #fff; padding: 20px; border-radius: 10px; 
            border: 1px solid #e2e8f0; border-right: 8px solid var(--main-text); 
            font-size: 1.9vw; font-weight: 700; color: #1e293b; line-height: 1.3;
            text-align: center;
        }

        /* Events Section (1/3 height) */
        .events-card { height: 30%; position: relative; }
        #events-list { padding: 10px; flex: 1; }
        .qr-gym-area { position: absolute; bottom: 8px; right: 8px; display: flex; align-items: center; gap: 5px; background: white; padding: 3px; border: 1px solid #ddd; border-radius: 4px; }
        .qr-gym-area span { font-size: 0.75vw; font-weight: 800; color: #0369a1; }

        /* Promo Section (2/3 height) */
        .promo-card { height: 70%; background: #fffdf5; }
        .cake-img { width: 100%; height: 55%; object-fit: cover; }
        .promo-details { padding: 10px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
        .promo-title { font-size: 1.3vw; font-weight: 800; color: #854d0e; }
        .promo-btn { background: var(--accent); color: #000; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 1.1vw; }
        .promo-footer-qr { display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px dashed #ccc; padding-top: 5px; }
        .promo-footer-qr span { font-size: 0.7vw; color: #64748b; }

        .emergency-bar { background: #ef4444; color: white; padding: 1.2vh; text-align: center; font-size: 1.8vw; font-weight: 900; border-radius: 10px; }

        /* News Footer */
        .footer { height: 5vh; background: #fff; width: 100vw; display: flex; align-items: center; position: relative; border-top: 3px solid #ee2d24; overflow: hidden; }
        .ticker-move { display: inline-block; white-space: nowrap; animation: ticker-loop 150s linear infinite; font-size: 1.8vw; font-weight: 800; color: #ee2d24; }
        @keyframes ticker-loop { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .ynet-tag { background: #ee2d24; color: white; font-weight: 900; font-size: 1.6vw; width: 80px; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; position: absolute; left: 0; }
    </style>
</head>
<body>

<div class="header-wrapper">
    <div class="header-right">
        <span>📍</span>
        <span>דודו דותן 2, נתניה</span>
    </div>
    <div class="header-center">
        <div id="live-clock">--:--</div>
        <div id="live-date">--.--.----</div>
    </div>
    <div class="header-left">Gal & Yarden Board ©</div>
</div>

<div class="stage">
    <div class="main-col">
        <div class="card" style="flex: 1;">
            <div class="card-header">📢 הודעות ועד הבית</div>
            <div id="message-box"></div>
        </div>
        <div class="emergency-bar">🚨 חירום חב' ניהול: 052-6663722</div>
    </div>

    <div class="side-col">
        <div class="card events-card">
            <div class="card-header">🗓️ אירועים</div>
            <div id="events-list"></div>
            <div class="qr-gym-area">
                <span>שריון ג'ימבורי:</span>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=60x60&data=https://forms.gle/FiVeEZ6pes8JKA7d6" style="height: 4vh; width: 4vh;">
            </div>
        </div>

        <div class="card promo-card">
            <img src="https://i.postimg.cc/8PKxcRFT/PHOTO-2026-02-24-10-45-14.jpg" class="cake-img">
            <div class="promo-details">
                <div class="promo-title">🥐 עוגות שמרים מעולם אחר!</div>
                <div class="promo-btn">להזמנות: רון 052-2221491</div>
                <div class="promo-footer-qr">
                    <span>רוצים לפרסם כאן?<br>סרקו בוואטסאפ</span>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=60x60&data=https%3A%2F%2Fwa.me%2F972502655525" style="height: 5vh; width: 5vh;">
                </div>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    <div class="ynet-tag">ynet</div>
    <div class="ticker-wrap"><div class="ticker-move" id="news-ticker">מתחבר למבזקים...</div></div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhGwGPiqNXmESzkgh6oW-KDGlgMaBoIiYDd0ennIUNlOwVQH2F7DWIDyZ6Fe_3wrcY/exec';

    function updateDateTime() {
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('live-date').innerText = now.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit', year:'numeric'}).replace(/\//g, '.');
    }

    async function updateData() {
        try {
            const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
            const data = await res.json();
            if (data.messages && data.messages.length > 1) {
                document.getElementById('message-box').innerHTML = data.messages.slice(1).reverse().map(m => 
                    `<div class="msg-bubble">${m.toString().replace(/#/g,'<br>')}</div>`
                ).join('');
            }
            if (data.events) {
                document.getElementById('events-list').innerHTML = data.events.slice(0, 3).map(e => {
                    const p = e.split('|');
                    return `<div style="font-size:1.1vw; font-weight:800; margin-bottom:5px; color:#1e293b;">• ${p[1].split(':')[0]}</div>`;
                }).join('');
            }
        } catch(e) {}
    }

    async function fetchNews() {
        try {
            const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.ynet.co.il%2FIntegration%2FStoryRss2.xml&t=${Date.now()}`);
            const data = await res.json();
            if(data.status === 'ok') {
                const newsItems = data.items.map(i => i.title).join("  •  ");
                document.getElementById('news-ticker').innerText = "  •  " + newsItems;
            }
        } catch(e) {}
    }

    setInterval(updateDateTime, 1000); 
    setInterval(updateData, 30000); 
    setInterval(fetchNews, 60000);
    updateDateTime(); updateData(); fetchNews();
</script>
</body>
</html>
